# Copy this to config.properties and edit the following:

# REQUIRED: Put your organization name after the equal sign (keep it short)
orgName=Sample Club

# REQUIRED: Put here the real IP hostname or numeric of your mail sending host
# Use 0.0.0.0 or 127.0.0.1 if mail server runs on same machine as web server.
mail.smtp.host=0.0.0.0

# Optional: prefix for subject on all group emails
mail.subject.prefix=[MyClub]

# REQUIRED: Unsubscribe policy, complete, e.g.
# mail.unsubscribe=Send mail to unsubscribe@bleah.com
# mail.unsubscribe=Visit https://bleah.com/list/unsubscribe
mail.unsubscribe=Send mail to unsubscribe@bleah.com

# OPTIONAL BUT STRONGLY RECOMMENDED: Configure a no-reply address; this will trigger a Reply-To header
# with the sender's real email and the From: line will have this no-reply;
# this is to work around aggressive spam filtering at GMail, Yahoo, Rogers, etc.
# (common mailing list management practice)
mail.smtp.from="noreply@nowhere.moc"
