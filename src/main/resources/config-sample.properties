# Copy this to config.properties and edit the following:

# REQUIRED: Put your organization name after the equal sign (keep it short)
orgName=Sample Club

# REQUIRED: Put here the real IP hostname or numeric of your mail sending host
# Use 0.0.0.0 or 127.0.0.1 if mail server runs on same machine as web server.
mail.smtp.host=0.0.0.0

# OPTIONAL: Put here a valid email for the sender
# The "mail.sender" property may be set to a fake "no-reply" type address,
# absent which the mail will be sent from the email of the logged-in user,
# assuming that this is syntactically valid (failing that, an exception
# will be thrown in the mailing process, and you don't want that).

# mail.sender=nobody@nowhere.mock
