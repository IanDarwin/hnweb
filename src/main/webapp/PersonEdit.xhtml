<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:of="http://omnifaces.org/functions"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Member Edit</ui:define>
<h:head>
<f:metadata>
    <f:event type="preRenderView" rendered="#{!empty request.getParameter('personId')}" listener="#{personHome.wire(request.getParameter('personId'))}"/>
    <f:event type="preRenderView" rendered="#{ empty request.getParameter('personId')}" listener="#{personHome.create()}"/>
</f:metadata>
</h:head>

<ui:define name="body">
	<h:form id="personForm">
	<p:panel>
		<f:facet name="header">Member Edit</f:facet>
		<h:panelGrid columns='3'>
		
		Id:
		<h:outputText id="idTF" value="#{personHome.instance.id}"/>
		<h:message id='idMessage' for='idTF'/>
		
		First Name:
		<h:inputText id="firstnameTF" value="#{personHome.instance.firstName}" required='true'/>
		<h:message id='firstnameMessage' for='firstnameTF'/>
		
		M.I.:
		<h:inputText id="middlenameTF" value="#{personHome.instance.middle}" required='false'/>
		<h:message id='middlenameMessage' for='middlenameTF'/>
		
		Last Name:
		<h:inputText id="lastnameTF" value="#{personHome.instance.lastName}" required='true'/>
		<h:message id='lastnameMessage' for='lastnameTF'/>

		<p:outputLabel for="memberTypeChoice" value="Member Type: "/>
		<ui:fragment id="primoChooser">
		<p:selectOneMenu id="memberTypeChoice" value="#{personHome.instance.memberType}" partialSubmit="true">
			<f:selectItems value="#{factories.memberTypes}"/>
			<p:ajax listener="#{personHome.computeEnableMasterMember}" update="primoMenu"/>
		</p:selectOneMenu>
			Master: 
			<h:selectOneMenu id="primoMenu" 
                value="#{personHome.instance.masterMember}"
				disabled="#{!personHome.enableMasterMember}"
				converter="entityConverter"
                >
                <f:selectItems var="_member" value="#{personHome.memberList}"
                	noSelectionValue="#{personHome.memberList[0]}"
                	itemLabel="#{_member.name}"
                    itemValue="#{_member}"/>
            </h:selectOneMenu>
        </ui:fragment>
		<h:message id='primoMessage' for='primoMenu'/>

		Address:
		<h:inputText id="addressTF" value="#{personHome.instance.address}" required='true'/>
		<h:message id='addressMessage' for='addressTF'/>

		City:
		<h:inputText id="cityTF" value="#{personHome.instance.city}" required='true'/>
		<h:message id='cityMessage' for='cityTF'/>
		
		Province,Country,PostCode:
		<ui:fragment>
			<h:inputText id="provinceTF" value="#{personHome.instance.province}"/>
			<p:selectOneMenu id="country" value="#{personHome.instance.country}" style="width:150px">
                <!-- <p:ajax listener="#{dropdownView.onCountryChange}" update="city" />  -->
                <f:selectItem itemLabel="Select Country" itemValue="" noSelectionOption="true" />
                <f:selectItem itemLabel="Canada" itemValue="CA" />
                <f:selectItem itemLabel="U.S.A." itemValue="US" />
            </p:selectOneMenu>
			<h:inputText id="postcodeTF" value="#{personHome.instance.postCode}" 
				validator="#{personHome.validatePostCode}" required='true'/>
		</ui:fragment>
		<ui:fragment>
			<h:message id='provinceMessage' for='provinceTF'/>
			<h:message id='postcodeMessage' for='postcodeTF'/>
		</ui:fragment>

		Phones:
		<ui:fragment>
			Home: <h:inputText id="homePhoneTF" value="#{personHome.instance.homePhone}"/>
			Mobile: <h:inputText id="cellPhoneTF" value="#{personHome.instance.cellPhone}"/>
		</ui:fragment>
		<h:message id='homePhoneMessage' for='homePhoneTF'/>

		Email:
		<h:inputText id="emailTF" value="#{personHome.instance.email}"
			validator="#{personHome.validateEmail}">
			<f:ajax event="blur" render='emailMessage'/>
		</h:inputText>
		<h:message id='emailMessage' for='emailTF'/>

		<p:outputLabel for="expdt" value="Expiry:" />
		<p:selectOneMenu id="expdt" value="#{personHome.instance.expiryDate}">
			<f:selectItem itemLabel="2015" itemValue="2015" />
			<f:selectItem itemLabel="2016" itemValue="2016" />
			<f:selectItem itemLabel="2017" itemValue="2017" />
			<f:selectItem itemLabel="2018" itemValue="2018" />
			<f:selectItem itemLabel="2019" itemValue="2019" />
			<f:selectItem itemLabel="2020" itemValue="2020" />
		</p:selectOneMenu>
			
		Club Executive Position if any:
		<h:inputText id="positionTF" value="#{personHome.instance.position}"/>
		<h:message id='positionMessage' for='positionTF'/>

		</h:panelGrid>

	</p:panel>

	<p:commandButton value="Save" action="#{personHome.update}" ajax='false'/>
	</h:form>
	<h:form>
	<!-- In their own form to avoid hanging on validation -->
	<p:commandButton value="Delete (no confirmation!)" action="#{personHome.remove}" ajax='false'/>
	<p:commandButton value="Cancel" action="#{personHome.cancel}" ajax='false'/>
	</h:form>
	
</ui:define>
</ui:composition>
