<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      template="/template/template.xhtml">

<ui:define name="pageTitle">Member</ui:define>

<!-- Loads the member named by ?memberId=. Must be in this define, or Facelets ignores it. -->
<ui:define name="metadata">
	<f:metadata>
		<f:viewAction action="#{memberHome.wire(param.memberId)}"/>
	</f:metadata>
</ui:define>

<ui:define name="body">

	<div class="sheet">
		<h2>#{memberHome.instance.name}</h2>
		<dl class="details">
			<dt>First name</dt>
			<dd><h:outputText value="#{memberHome.instance.firstName}"/></dd>

			<dt>Last name</dt>
			<dd><h:outputText value="#{memberHome.instance.lastName}"/></dd>

			<dt>Membership</dt>
			<dd><h:outputText value="#{memberHome.instance.memberType}"/></dd>

			<dt>Expires</dt>
			<dd><h:outputText value="#{memberHome.instance.expiryYear}"/></dd>

			<dt>City</dt>
			<dd><h:outputText value="#{memberHome.instance.city}"/></dd>

			<dt>Province, country</dt>
			<dd>
				<h:outputText value="#{memberHome.instance.province}"/>#{' '}
				<h:outputText value="#{memberHome.instance.country}"/>
			</dd>

			<dt>Phone</dt>
			<dd>
				Home: <h:outputText value="#{memberHome.instance.homePhone}"/>
				#{' '}Mobile: <h:outputText value="#{memberHome.instance.cellPhone}"/>
				#{' '}Work: <h:outputText value="#{memberHome.instance.workPhone}"/>
			</dd>

			<dt>Email</dt>
			<dd><h:outputText value="#{memberHome.instance.email}"/></dd>

			<dt>Trips email list</dt>
			<dd><h:outputText value="#{memberHome.instance.emailTrips}"/></dd>

			<dt>Position</dt>
			<dd><h:outputText value="#{memberHome.instance.position}"/></dd>
		</dl>
	</div>

	<h:form styleClass="actions">
		<h:outputLink value="#{request.contextPath}/MemberEdit.web" rendered="#{identity.hasRole('admin')}"
			styleClass="ui-button ui-widget btn-secondary">
			Edit member
			<f:param name="memberId" value="#{memberHome.instance.id}"/>
		</h:outputLink>
		<p:commandButton value="Done" action="#{memberHome.done}" ajax="false"/>
	</h:form>

</ui:define>

</ui:composition>
