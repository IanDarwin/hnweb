<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      template="/template/template.xhtml">

<ui:define name="pageTitle">Member</ui:define>
<h:head>
<f:metadata>
    <f:event type="preRenderView" rendered="#{!empty request.getParameter('memberId')}" listener="#{memberHome.wire(request.getParameter('memberId'))}"/>
</f:metadata>
</h:head>

	<ui:define name="pageHeader">Member View</ui:define>

	<ui:define name="body">

			<p:panelGrid columns="2" title="MemberView">
				FirstName:
				<h:outputText value="#{memberHome.instance.firstName}"/>

				LastName:
				<h:outputText value="#{memberHome.instance.lastName}"/>

				Membership:
				<h:outputText value="#{memberHome.instance.memberType}"/>

				Expiry:
				<h:outputText value="#{memberHome.instance.expiryYear}"/>

				Address:
				<h:outputText value="#{memberHome.instance.address}"/>

				City:
				<h:outputText value="#{memberHome.instance.city}"/>

				Province,Country,PostCode:
				<ui:fragment>
				<h:outputText value="#{memberHome.instance.province}"/>#{' '}
				<h:outputText value="#{memberHome.instance.country}"/>#{' '}
				<h:outputText value="#{memberHome.instance.postCode}"/>
				</ui:fragment>

				Phone:
				<ui:fragment>
				Home: <h:outputText value="#{memberHome.instance.homePhone};"/>
				Mobile: <h:outputText value="#{memberHome.instance.cellPhone}"/>
				Work: <h:outputText value="#{memberHome.instance.workPhone}"/>
				</ui:fragment>

				Email:
				<h:outputText value="#{memberHome.instance.email}"/>

				Newsletter-delivery:
				<h:outputText value="#{memberHome.instance.newsletterMode}"/>

				Trips-List:
				<h:outputText value="#{memberHome.instance.emailTrips}"/>

				Position:
				<h:outputText value="#{memberHome.instance.position}"/>

			</p:panelGrid>

	<h:form>
		<h:outputLink value="MemberEdit.web" rendered="#{identity.hasRole('admin')}">
			Edit
			<f:param name="memberId" value="#{memberHome.instance.id}"/>
		</h:outputLink>
		<p:commandButton value="Done" action="#{memberHome.done}"/>
	</h:form>

	</ui:define>
			
</ui:composition>
