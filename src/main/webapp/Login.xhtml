<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      template="/template/template.xhtml">

<ui:define name="pageTitle">Member Login</ui:define>

<ui:define name="body">

	<p:panel>
		<f:facet name="header">Please login</f:facet>

		<h:form id="loginForm">
		<h:panelGrid columns="3">

		<h:outputText value="Your email:"/>
			<h:inputText id="email" value="#{identity.email}" required="true" message="email required" pt:placeholder="user@domain.name"/>
			<h:message for="email"/>

		Password: 	
			<h:inputSecret id="password" value="#{identity.password}" required="true" message="Password required" pt:placeholder="Password"/>
			<h:message for="password"/>

			#{' '}
			<h:commandButton id="login" action="#{identity.login}" value="Login"/>
			#{' '}
		
		</h:panelGrid>
		</h:form>

	</p:panel>
</ui:define>
</ui:composition>
