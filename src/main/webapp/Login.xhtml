<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      template="/template/template.xhtml">

<ui:define name="pageTitle">Log in</ui:define>

<ui:define name="body">

	<h:form id="loginForm" styleClass="sheet sheet-narrow">
		<div class="form-grid">

			<div class="field">
				<p:outputLabel for="email" value="Email"/>
				<div class="control">
					<h:inputText id="email" value="#{identity.email}" required="true"
						requiredMessage="Enter your email address."
						pt:placeholder="you@example.com" pt:autocomplete="username" size="30"/>
					<p:message for="email"/>
				</div>
			</div>

			<div class="field">
				<p:outputLabel for="password" value="Password"/>
				<div class="control">
					<h:inputSecret id="password" value="#{identity.password}" required="true"
						requiredMessage="Enter your password."
						pt:autocomplete="current-password" size="30"/>
					<p:message for="password"/>
				</div>
			</div>

		</div>

		<div class="actions">
			<h:commandButton id="login" action="#{identity.login}" value="Log in"/>
			<h:link outcome="ChangePassword1" value="Forgot your password?" id="forgot" styleClass="btn-link"/>
		</div>
	</h:form>

</ui:define>
</ui:composition>
