<ui:composition xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui"
      xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
      template="/template/template.xhtml">

<ui:define name="pageTitle">Member Login</ui:define>

<ui:define name="body">

	<p:panel>
		<f:facet name="header">JSF Login</f:facet>

		<h:form>
		User name: <h:inputText value="#{identity.userName}" pt:placeholder="name"/>
		<br/>
		Password: <h:inputSecret value="#{identity.password}"/>
		<br/>
		<h:commandButton action="#{identity.login}" value="Login"/>
		
		</h:form>

	</p:panel>
</ui:define>
</ui:composition>
