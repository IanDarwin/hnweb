<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Member Login</ui:define>

<ui:define name="body">

	<p:panel>
		<f:facet name="header">JSF Login</f:facet>

		<h:form>
		User name: <h:inputText value="#{identity.userName}"/>
		<br/>
		Password: <h:inputSecret value="#{identity.password}"/>
		<br/>
		<h:commandButton action="#{identity.login}" value="Login"/>
		
		</h:form>

	</p:panel>
</ui:define>
</ui:composition>
