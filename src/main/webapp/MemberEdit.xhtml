<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
	"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/template/template.xhtml">

<h:head>
<f:metadata>
	<f:event type="preRenderView" rendered="#{ empty request.getParameter('memberId')}" listener="#{memberHome.create()}"/>
	<f:event type="preRenderView" rendered="#{!empty request.getParameter('memberId')}" listener="#{memberHome.wire(request.getParameter('memberId'))}"/>
</f:metadata>
</h:head>

<ui:define name="pageTitle">Member Edit</ui:define>

<ui:define name="body">
	<h:form id="personForm">
	<p:panel>
		<f:facet name="header">Member Edit</f:facet>
		<h:panelGrid columns='3'>
		
		Id:
		<h:outputText id="idTF" value="#{memberHome.instance.id}"/>
		<h:message id='idMessage' for='idTF'/>
		
		First Name:
		<h:inputText id="firstnameTF" value="#{memberHome.instance.firstName}" required='true' size="50"/>
		<h:message id='firstnameMessage' for='firstnameTF'/>
		
		M.I.:
		<h:inputText id="middlenameTF" value="#{memberHome.instance.middle}" required='false' size="50"/>
		<h:message id='middlenameMessage' for='middlenameTF'/>
		
		Last Name:
		<h:inputText id="lastnameTF" value="#{memberHome.instance.lastName}" required='true' size="50"/>
		<h:message id='lastnameMessage' for='lastnameTF'/>

		<p:outputLabel for="memberTypeChoice" value="Member Type: "/>
		<ui:fragment id="primoChooser">
		<p:selectOneMenu id="memberTypeChoice" value="#{memberHome.instance.memberType}" partialSubmit="true">
			<f:selectItems value="#{factories.memberTypes}"/>
			<p:ajax listener="#{memberHome.notifySetMemberType}" update="primoChooser"/>
		</p:selectOneMenu>
			Master: 
			<h:selectOneMenu id="primoMenu" 
	            value="#{memberHome.instance.masterMember}"
				converter="entityConverter"
				disabled="#{memberHome.instance.getMemberType() != model.MemberType.Secondary}"
				>
				<!-- XXX here is where to kill the putrid '... SELECT ...' in bus tier code -->
	            <f:selectItems var="_member" value="#{memberHome.memberList}"
	            	noSelectionValue="#{memberHome.memberList[0]}"
	            	itemLabel="#{_member.name}"
	                itemValue="#{_member}"/>
	        </h:selectOneMenu>
	    </ui:fragment>
		<h:message id='primoMessage' for='primoMenu'/>

		Email:
		<h:inputText id="emailTF" value="#{memberHome.instance.email}" 
			required='#{memberHome.instance.memberType != model.MemberType.Secondary}'
			validator="#{memberHome.validateEmail}"
			size="50">
			<f:ajax event="blur" render='emailMessage'/>
		</h:inputText>
		<h:message id='emailMessage' for='emailTF'/>

		City:
		<h:inputText id="cityTF" value="#{memberHome.instance.city}" required='false'/>
		<h:message id='cityMessage' for='cityTF'/>
		
		Province,Country:
		<ui:fragment>
			<p:selectOneMenu id="country" value="#{memberHome.instance.country}" style="width:150px">
	            <!-- <p:ajax listener="#{dropdownView.onCountryChange}" update="city" />  -->
	            <f:selectItem itemLabel="Select Country" itemValue="" noSelectionOption="true" />
	            <f:selectItem itemLabel="Canada" itemValue="CA" />
	            <f:selectItem itemLabel="U.S.A." itemValue="US" />
	        </p:selectOneMenu>
			<p:selectOneMenu id="provinceMenu" value="#{memberHome.instance.province}" style="width:150px">
	            <f:selectItem itemLabel="Ontario" itemValue="ON" noSelectionOption="true" />
				<f:selectItems var="_prov" value="#{factories.canadaProvinces}"
	                itemValue="#{_prov.name()}"
	                itemlabel="#{_prov.longName}"/>
			</p:selectOneMenu>
		</ui:fragment>
		<ui:fragment>
			<h:message id='provinceMessage' for='provinceMenu'/>
		</ui:fragment>

		Phones:
		<ui:fragment>
			Home: <h:inputText id="homePhoneTF" value="#{memberHome.instance.homePhone}"/>
			Mobile: <h:inputText id="cellPhoneTF" value="#{memberHome.instance.cellPhone}"/>
		</ui:fragment>
		<h:message id='homePhoneMessage' for='homePhoneTF'/>

		<p:outputLabel for="expdt" value="Expiry:" />
		<p:selectOneMenu id="expdt" value="#{memberHome.instance.expiryYear}">
			<f:selectItem itemLabel="Unpaid" itemValue="0" />
			<!-- Maint note: always set the noSelectionOption to the current *expiry* year -->
			<f:selectItem itemLabel="2024" itemValue="2024" noSelectionOption="true" />
			<f:selectItem itemLabel="2025" itemValue="2025" />
			<f:selectItem itemLabel="2026" itemValue="2026" />
			<f:selectItem itemLabel="2027" itemValue="2027" />
			<f:selectItem itemLabel="2028" itemValue="2028" />
			<f:selectItem itemLabel="2029" itemValue="2029" />
			<f:selectItem itemLabel="2030" itemValue="2030" />
		</p:selectOneMenu>
		&nbsp;
			
		<p:outputLabel for="positionTF" value="Club Executive Position if any:"/>
		<h:inputText id="positionTF" value="#{memberHome.instance.position}"/>
		<h:message id='positionMessage' for='positionTF'/>

		</h:panelGrid>

	</p:panel>

	<p:commandButton value="Save" action="#{memberHome.saveOrUpdate}" ajax='false'/>
	</h:form>
	<h:form>
	<!-- In their own form to avoid hanging on validation -->
	<p:commandButton value="Delete" action="#{memberHome.remove()}" icon="ui-icon-trash">
	    <p:confirm header="Confirm Deletion" message="Really delete this member?" icon="ui-icon-alert" />
	</p:commandButton>
 
	<p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
	    <p:commandButton value="Yes" type="button" styleClass="ui-confirmdialog-yes" icon="ui-icon-check" />
	    <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="ui-icon-close" />
	</p:confirmDialog>

	<p:commandButton value="Cancel" action="#{memberHome.cancel}" ajax='false'/>
	</h:form>
	
</ui:define>
</ui:composition>
