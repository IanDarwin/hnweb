<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Welcome to Headwaters Nature!</ui:define>
<ui:define name="body">

	<p:panel>

	<p:panel>
		<h:outputText value="&lt;b&gt;News/Plans&lt;/b&gt; We've refreshed the look of this site.
		You can now set or reset your own password, from the login page.
		And we're considering how to do online updates, registrations and renewals.
		Watch this space for more details!
		" escape="false"/>
	</p:panel>

	<p:dataTable var="evt" value="#{eventList.findUpcoming()}">
		<f:facet name="header">Upcoming Events</f:facet>
		<p:column width="12%">
			<f:facet name="header">Date</f:facet>
			#{evt.date}
		</p:column>
		<p:column width="12%">
			<f:facet name="header">Time</f:facet>
			<h:outputText value="#{evt.times}"/>
		</p:column>
		<p:column>
			<f:facet name="header">Event</f:facet>
			#{evt.title}
			<h:outputText value=" with #{evt.speakerName}" rendered="#{!empty(evt.speakerName) and evt.speakerName != 'T.B.A.'}"/>
		</p:column>
		<p:column width="15%">
			<a href="/EventView.web?eventId=#{evt.id}">Event Details</a>
		</p:column>
	</p:dataTable>
	<br/>

	<a href="SignupPaperForm.pdf">Renew Membership by mail or in person - PDF form</a>
	<br/>
	<a href="ChangePassword1.web">Create or Change your password</a>
	<br/>
	<a href="MemberView.web">Update your own details (coming next) (login required)</a>
	<br/>
	<a href="Renew.web">Renew your Membership Online (coming later) (login required)</a>

	</p:panel>
</ui:define>
</ui:composition>
