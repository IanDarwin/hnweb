<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<!--
  Change Password, step 1: ask for the account email.
-->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="jakarta.faces.core"
    xmlns:h="jakarta.faces.html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Change Password (Step 1 of 2)</ui:define>
<ui:define name="body">

        <p>Step 1 of 2: enter the email address you use to log in. If it matches a
           valid account, we will send you a token to use in Step 2.</p>

		<ui:fragment rendered="#{param.error eq 'member'}">
			<ul class="messages" role="alert">
				<li class="errormsg">Sorry, could not find that member.
					Please <a href="ChangePassword1.web">try again</a>.</li>
			</ul>
		</ui:fragment>

		<!--
		Plain HTML form (not h:form) because it POSTs straight to the
		/changePassword1 endpoint rather than to a JSF action.
		-->
        <form id="step1" method="post" action="#{request.contextPath}/api/changePassword1">
            <div class="field">
                <label for="email">Email<span class="req" aria-hidden="true">*</span></label>
                <input type="email" id="email" name="email" required="required"
                       autocomplete="username" autofocus="autofocus"/>
            </div>
            <div class="actions">
                <button type="submit" class="primary">Continue</button>
            </div>
        </form>

</ui:define>
</ui:composition>
