<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	template="/template/template.xhtml">

<h:head>
</h:head>

<ui:define name="pageTitle">Executive Functions</ui:define>

<ui:define name="body">
	<p:panel>
		<f:facet name="header">Site status/info</f:facet>
		<ul>
		<li>T.B.A.</li>
		</ul>
	</p:panel>
	<p:panel>
		<f:facet name="header">Executive-Only Information</f:facet>
		<a href="/DeletedList.web">Deleted Members</a>
	</p:panel>
	<h:form id="personForm">
		<p:panel>
			<f:facet name="header">Executive Functions</f:facet>
			
			<h:inputText id="idTF" value="#{memberHome.id}"/>
			#{' '}
			<p:commandButton value="Resurrect Deleted Member" action="#{memberHome.unDelete(memberHome.id)}" ajax='false'/>
			#{' '}
			<p:commandButton value="Cancel" action="#{memberHome.cancel}" ajax='false'/>
		</p:panel>
	</h:form>
	
</ui:define>
</ui:composition>
