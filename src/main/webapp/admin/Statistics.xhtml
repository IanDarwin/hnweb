<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Membership Statistics</ui:define>
<ui:define name="body">

	<p:panel>
	<f:facet name="header">Here's looking in the microscope...</f:facet>

	<p>All but #6 <i>exclude</i> deleted/archived members</p>

	<!-- Print the table, or, an error -->
	<p:dataTable border='1'
		var="stat" value="#{statsBean.getStatistics()}"
		>
		<p:column>
			<f:facet name="header">Name</f:facet>
			<h:outputText value="#{stat.name}"/>
		</p:column>
		<p:column>
			<f:facet name="header">Quantity</f:facet>
			<h:outputText value="#{stat.result}"/>
		</p:column>

		<p:column style="width: 10%">
			<f:facet name="header">Actions</f:facet>
			<p>Nothing you can do here.</p>
		</p:column>
	</p:dataTable>
	</p:panel>
</ui:define>
</ui:composition>
