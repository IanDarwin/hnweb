<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Full Membership List</ui:define>
<ui:define name="body">

	<ui:fragment rendered="#{!identity.hasRole('admin')}">
		<meta http-equiv="refresh" content="0;URL=#{identity.loggedIn?'MemberView.web':'Login.web'}"/>
	</ui:fragment>

	<p:panel>
	<f:facet name="header">Here's looking at your Members  - #{memberList.findAll().size()} of them.</f:facet>

	<!-- Print the table, or, an error -->
	<h:outputText
		value="Arrr, Billy! I can't find any people. Did we add any yet??"
		rendered="#{empty memberList.findAll()}"/>

	<!-- Display the main part of the whole page. -->
	<p:dataTable border='1' 
		rendered="#{!empty memberList.findAll()}"
		var="member" value="#{memberList.findAll()}" 
		>
		<p:column>
			<f:facet name="header">First Name</f:facet>
			<h:outputText value="#{member.firstName}"/>
		</p:column>
		<p:column>
			<f:facet name="header">Last Name</f:facet>
			<h:outputText value="#{member.lastName}"/>
		</p:column>
		<p:column>
			<f:facet name="header">Email</f:facet>
			<h:outputText value="#{member.email}"/>
		</p:column>
		<p:column width="3%">
			<f:facet name="header">Type</f:facet>
			<h:outputText value="#{member.memberType.shortName}"/>
		</p:column>
		<p:column>
			<f:facet name="header">Exec Pos'n</f:facet>
			<h:outputText value="#{member.position}"/>
		</p:column>
		<p:column>
			<f:facet name="header">Home Phone<br/>Cell Phone</f:facet>
			<h:outputText value="#{member.homePhone}"/>#{' '}
			<h:outputText value="#{member.cellPhone}"/>
		</p:column>
		<p:column>
			<f:facet name="header">Address</f:facet>
			<h:outputText value="#{member.address}"/>
		</p:column>
		<p:column>
			<f:facet name="header">City</f:facet>
			<h:outputText value="#{member.city}"/>
		</p:column>
		<p:column>
			<f:facet name="header">PostCode</f:facet>
			<h:outputText value="#{member.postCode}"/>
		</p:column>
		<p:column width="5%">
			<f:facet name="header">Expiry</f:facet>
			<h:outputText value="#{member.expiryYear}"/>
		</p:column>

		<p:column style="width: 5%">
			<f:facet name="header">Actions</f:facet>
			<h:outputLink value="MemberView.web">
				View
				<f:param name="memberId" value="#{member.id}"/>
			</h:outputLink>
			<h:outputLink value="MemberEdit.web" rendered="#{identity.hasRole('admin')}">
				Edit
				<f:param name="memberId" value="#{member.id}"/>
			</h:outputLink>
		</p:column>
	</p:dataTable>
	</p:panel>
</ui:define>
</ui:composition>
