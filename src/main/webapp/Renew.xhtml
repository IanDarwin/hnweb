<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Renew membership</ui:define>
<ui:define name="body">

	<h:form id="renewForm" styleClass="sheet sheet-narrow">
		<div class="form-grid">

			<div class="field">
				<p:outputLabel for="member" value="Member"/>
				<div class="control">
					<!--
						itemValue must be the Member object itself: memberConverter turns it into
						the primary key for the browser and back again on submit.
					-->
					<p:autoComplete id="member"
						value="#{renewAction.member}"
						completeMethod="#{memberCompleteAction.completeMember}"
						converter="#{memberConverter}"
						var="_member" itemLabel="#{_member.names}" itemValue="#{_member}"
						forceSelection="true" scrollHeight="260"
						required="true" requiredMessage="Choose a member from the list."
						placeholder="Start typing a last name"
						effect="blind"/>
					<p:message for="member"/>
					<div class="hint">Type part of a last name, then pick the member from the list.</div>
				</div>
			</div>

			<div class="field">
				<p:outputLabel for="numYears" value="Years to renew"/>
				<div class="control">
					<h:selectOneMenu id="numYears" value="#{renewAction.numYears}">
						<f:selectItem itemLabel="1 year" itemValue="1"/>
						<f:selectItem itemLabel="2 years" itemValue="2"/>
						<f:selectItem itemLabel="3 years" itemValue="3"/>
					</h:selectOneMenu>
					<p:message for="numYears"/>
				</div>
			</div>

			<div class="field">
				<p:outputLabel for="paymentType" value="Paid by"/>
				<div class="control">
					<h:selectOneMenu id="paymentType" value="#{renewAction.paymentType}">
						<f:selectItems value="#{factories.renewalPaymentTypes}"
							var="_pt" itemValue="#{_pt}" itemLabel="#{_pt.label}"/>
					</h:selectOneMenu>
					<p:message for="paymentType"/>
				</div>
			</div>

		</div>

		<div class="actions">
			<p:commandButton value="Renew membership" action="#{renewAction.renew}" ajax="false"/>
			<h:outputLink value="#{request.contextPath}/MemberList.web" styleClass="btn-link">Cancel</h:outputLink>
		</div>
	</h:form>

</ui:define>
</ui:composition>
