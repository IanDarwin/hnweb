<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Renew Membership Online</ui:define>
<ui:define name="body">

	<ui:fragment rendered="#{!identity.hasRole('admin')}">
		<meta http-equiv="refresh" content="0;URL=#{identity.loggedIn?'MemberView.web':'Login.web'}"/>
	</ui:fragment>

	<p:panel>

	<h:form>

		<p:panelGrid columns='2'>

		<h:outputText value="Member"/>
		<h:selectOneMenu value="#{renewAction.member}"
			converter="entityConverter"
			>
			<f:selectItems var="_member" value="#{memberHome.memberList}"
				noSelectionValue="#{memberHome.memberList[0]}"
				itemLabel="#{_member.name}"
				itemValue="#{_member}"/>
		</h:selectOneMenu>

		<h:outputText value="Number of Years"/>
		<h:selectOneMenu value="#{renewAction.numYears}">
			<f:selectItem itemLabel='1' itemValue='1'/>
			<f:selectItem itemLabel='2' itemValue='2'/>
			<f:selectItem itemLabel='3' itemValue='3'/>
		</h:selectOneMenu>

		&nbsp;
		<p:commandButton value="Save" action="#{renewAction.renew}" ajax='false'/>
		
		</p:panelGrid>

	</h:form>
	</p:panel>
</ui:define>
</ui:composition>
