<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Event View</ui:define>
<!-- Must be in this define, or Facelets ignores it -->
<ui:define name="metadata">
	<f:metadata>
		<f:viewAction action="#{eventHome.wire(param.eventId)}"/>
	</f:metadata>
</ui:define>

<ui:define name="body">

	<h:form id="entityForm">
	<p:panel>
		<f:facet name="header">Event Detail</f:facet>
		<p:panel>

		<h:outputText value="Title:"/>
		<h:outputText id="titleTF" value="#{eventHome.instance.title}"/>

		<br/>
		
		<h:outputText value="Date:"/>
		<h:outputText id="dateTF" value="#{eventHome.instance.date}"/>
		&nbsp;
		<h:outputText value="Time:"/>
		<h:outputText id="timesTF" value="#{eventHome.instance.startTime} - #{eventHome.instance.endTime}"/>

		<br/>

		<h:outputText value="Location:"/>
		<h:outputText id="locationTF" value="#{eventHome.instance.location}"/>

		<br/>

		<h:outputText value="Event Details:"/>
		<h:outputText id="eventAbstractTF" value="#{eventHome.instance.eventAbstract}"/>

		<br/>

		<h:outputText value="Speaker:"/>
		<h:outputText id="speakerNameTF" value="#{eventHome.instance.speakerName}"/>

		<br/>

		<h:outputText value="Speaker's Bio:"/>
		<h:outputText id="speakerBioTF" value="#{eventHome.instance.speakerBio}"/>

		</p:panel>
	</p:panel>

	<!-- A plain GET link, like the Edit links on EventList: the id travels in the URL, and
	     EventEdit loads it. (A command button's f:param is NOT added to a redirect URL.) -->
	<p:button value="Edit event" outcome="EventEdit.web" styleClass="btn-secondary"
		rendered="#{identity.loggedIn and identity.hasRole('admin')}">
		<f:param name="eventId" value="#{eventHome.instance.id}"/>
	</p:button>

	<p:commandButton value="Done" action="#{eventHome.done}" ajax='false'/>
	</h:form>
	
</ui:define>
</ui:composition>
