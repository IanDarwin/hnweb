<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	template="/template/template.xhtml">

<ui:define name="pageTitle">Event View</ui:define>
<h:head>
<f:metadata>
    <f:event type="preRenderView" rendered="#{!empty request.getParameter('eventId')}" listener="#{eventHome.wire(request.getParameter('eventId'))}"/>
</f:metadata>
</h:head>

<ui:define name="body">

	<h:form id="entityForm">
	<p:panel>
		<f:facet name="header">Event Detail</f:facet>
		<h:panelGrid columns='2'>
		
		Id:
		<h:outputText id="idTF" value="#{eventHome.instance.id}"/>
		
		<h:outputText value="Date:"/>
		<h:outputText id="dateTF" value="#{eventHome.instance.date}"/>

		<h:outputText value="Times:"/>
		<h:outputText id="timesTF" value="#{eventHome.instance.times}"/>

		<h:outputText value="Title:"/>
		<h:outputText id="titleTF" value="#{eventHome.instance.title}"/>

		<h:outputText value="Location:"/>
		<h:outputText id="locationTF" value="#{eventHome.instance.location}"/>

		<h:outputText value="EventAbstract:"/>
		<h:outputText id="eventAbstractTF" value="#{eventHome.instance.eventAbstract}"/>

		<h:outputText value="SpeakerName:"/>
		<h:outputText id="speakerNameTF" value="#{eventHome.instance.speakerName}"/>

		<h:outputText value="SpeakerBio:"/>
		<h:outputText id="speakerBioTF" value="#{eventHome.instance.speakerBio}"/>

		</h:panelGrid>
	</p:panel>

	<p:commandButton value="Edit" action="/eventEdit.web" ajax='false'/>
	<p:commandButton value="Done" action="#{eventHome.done}" ajax='false'/>
	</h:form>
	
</ui:define>
</ui:composition>
